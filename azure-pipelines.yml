trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  name: Terraform-Parallel-Pool

stages:

- stage: TerraformValidation
  displayName: Terraform Validation

  jobs:

  - job: TerraformValidate
    displayName: Terraform Validate - Agent 1

    steps:
    - checkout: self

    - script: terraform version
      displayName: Terraform Version

    - script: terraform fmt -check -recursive
      workingDirectory: Environment
      displayName: Terraform Format Check

    - script: terraform init -backend=false
      workingDirectory: Environment
      displayName: Terraform Init

    - script: terraform validate
      workingDirectory: Environment
      displayName: Terraform Validate


  - job: TerraformPlan
    displayName: Terraform Plan - Agent 2

    steps:
    - checkout: self

    - script: terraform version
      displayName: Terraform Version

    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: 'Terraform-Azure-Secret'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

          terraform init
          terraform plan
        workingDirectory: '$(Build.SourcesDirectory)\Environment'